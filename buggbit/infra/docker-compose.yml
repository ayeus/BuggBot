
services:
  mysql:
    image: mysql:8.0
    container_name: buggbit-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: buggbit
      MYSQL_USER: buggbit
      MYSQL_PASSWORD: buggbitpwd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]

volumes:
  mysql_data:
